name: pakola_waters
description: Pakola Waters — customer, driver, supervisor, and admin apps.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  authentication:
    path: ../packages/authentication
  core:
    path: ../packages/core
  cupertino_icons: ^1.0.8
  design_system:
    path: ../packages/design_system
  firebase:
    path: ../packages/firebase
  flutter_screenutil: ^5.9.3
  flutter_image_compress: ^2.4.0
  flutter_map: ^8.1.1
  go_router: ^16.0.0
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: any
  latlong2: ^0.9.1
  l10n:
    path: ../packages/l10n
  models:
    path: ../packages/models
  provider: ^6.1.5
  repositories:
    path: ../packages/repositories
  rider_management:
    path: ../packages/rider_management
  services:
    path: ../packages/services
  shared_widgets:
    path: ../packages/shared_widgets
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
